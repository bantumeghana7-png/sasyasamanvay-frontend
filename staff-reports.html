<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reports - SasyaSamanvay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--dark-green:#3F5640;--pastel-bg:#EDF2EB;--light-bg:#FAFCF9;--border-color:#DDE5D8;--text-dark:#2F4730;--text-secondary:#6B7280}*{box-sizing:border-box}body{margin:0;background:var(--light-bg);color:var(--text-dark);font:15px 'Work Sans',sans-serif}h1,h2{font-family:Lora,serif;color:var(--dark-green);margin:0}.topbar{background:#fff;border-bottom:1px solid var(--border-color);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--dark-green);font:700 18px Lora,serif}.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--dark-green);display:grid;place-items:center}.back{color:var(--text-secondary);text-decoration:none;font-size:13.5px}.main{max-width:1100px;margin:0 auto;padding:32px 24px}.sub{color:var(--text-secondary);font-size:13.5px;margin-top:6px}.panel{background:#fff;border:1px solid var(--border-color);border-radius:10px;padding:24px;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{border:1px solid var(--border-color);padding:18px;border-radius:6px}.label{font-size:12px;color:var(--text-secondary)}.value{font:700 24px Lora,serif;color:var(--dark-green);margin-top:5px}.table{width:100%;border-collapse:collapse;margin-top:8px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--border-color);font-size:13px}.table th{font-size:12px;color:var(--text-secondary);text-transform:uppercase}.loading{color:var(--text-secondary)}.error{color:#B3432B;background:#FBEAE6;padding:14px;border-radius:6px}@media(max-width:650px){.stats{grid-template-columns:1fr}.table{font-size:12px;display:block;overflow-x:auto}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">🌾</span>SasyaSamanvay</a><a class="back" id="backLink" href="/staff-center-incharge.html">Back</a></header><main class="main"><div id="content" class="loading">Loading reports...</div></main><script>
const session=JSON.parse(localStorage.getItem('sasyaSession')||'null');const pathRole=window.location.pathname.startsWith('/center-incharge/')?'incharge':'disbursing';const headers={Authorization:'Bearer '+(session&&session.token)};
document.getElementById('backLink').href=pathRole==='incharge'?'/staff-center-incharge.html':'/staff-disbursing-officer.html';
async function guardReports(){try{const response=await fetch('/api/auth/session',{headers});const result=await response.json();if(!response.ok||result.session.role!==pathRole)throw new Error();document.getElementById('backLink').href=pathRole==='incharge'?'/staff-center-incharge.html':'/staff-disbursing-officer.html';loadReports();}catch(error){localStorage.removeItem('sasyaSession');window.location.replace('/staff-login.html');}}
guardReports();
async function loadReports(){try{const response=await fetch('/api/staff/reports',{headers});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to load reports.');const report=result.reports;const rows=report.records||[];document.getElementById('content').innerHTML='<h1>'+ (pathRole==='incharge'?'Center':'Disbursement') +' Reports</h1><div class="sub">'+result.center+'</div><div class="stats"><div class="stat"><div class="label">Farmers</div><div class="value">'+report.totalFarmers+'</div></div><div class="stat"><div class="label">Total quantity</div><div class="value">'+report.totalQuantity+' qtl</div></div><div class="stat"><div class="label">Records</div><div class="value">'+rows.length+'</div></div></div><section class="panel"><h2>Procurement records</h2>'+(rows.length?'<table class="table"><tr><th>Farmer</th><th>Crop</th><th>Stage</th><th>Weight</th><th>Payment</th></tr>'+rows.map(item=>'<tr><td>'+item.farmer.name+'</td><td>'+item.procurement.crop+'</td><td>'+item.procurement.stage+'</td><td>'+ (item.procurement.quantity?.weight||'-')+'</td><td>'+ (item.payment?.status||'Not ready')+'</td></tr>').join('')+'</table>':'<p class="sub">No procurement records found for this center.</p>')+'</section>';}catch(error){document.getElementById('content').innerHTML='<div class="error">'+error.message+'</div>';}}
</script><script src="i18n.js"></script></body></html>
