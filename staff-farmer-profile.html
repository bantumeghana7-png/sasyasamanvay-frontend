<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Profile - SasyaSamanvay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark-green:#3F5640;--pastel-bg:#EDF2EB;--light-bg:#FAFCF9;--border-color:#DDE5D8;--text-dark:#2F4730;--text-secondary:#6B7280;--card-white:#fff;--radius-md:10px}*{box-sizing:border-box}body{margin:0;background:var(--light-bg);color:var(--text-dark);font:15px 'Work Sans',sans-serif}h1,h2{font-family:Lora,serif;color:var(--dark-green);margin:0}.topbar{background:#fff;border-bottom:1px solid var(--border-color);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--dark-green);font:700 18px Lora,serif}.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--dark-green);display:grid;place-items:center}.back{color:var(--text-secondary);text-decoration:none;font-size:13.5px}.main{max-width:1100px;margin:0 auto;padding:32px 24px}.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px}.sub{color:var(--text-secondary);font-size:13.5px;margin-top:6px}.panel{background:#fff;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:24px;margin-bottom:20px}.panel h2{font-size:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 28px}.label{color:var(--text-secondary);font-size:12px;margin-bottom:3px}.value{font-weight:600}.badge{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--pastel-bg);color:var(--dark-green);font-size:12px;font-weight:600}.error{color:#B3432B;background:#FBEAE6;padding:14px;border-radius:6px}.loading{color:var(--text-secondary)}@media(max-width:650px){.header{display:block}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">🌾</span>SasyaSamanvay</a><a class="back" id="backLink" href="index.html">Back</a></header><main class="main"><div id="content" class="loading">Loading farmer profile...</div></main>
<script>
const session=JSON.parse(localStorage.getItem('sasyaSession')||'null');
const pathParts=window.location.pathname.split('/').filter(Boolean);const rolePath=pathParts[0];const farmerId=decodeURIComponent(pathParts[2]||'');const expectedRole=rolePath==='center-incharge'?'incharge':rolePath==='quantity-inspector'?'quantity':'disbursing';
const headers={Authorization:'Bearer '+(session&&session.token)};
async function guardProfile(){try{const response=await fetch('/api/auth/session',{headers});const result=await response.json();if(!response.ok||result.session.role!==expectedRole)throw new Error();document.getElementById('backLink').href=expectedRole==='incharge'?'/staff-center-incharge.html':expectedRole==='quantity'?'/staff-quantity-inspector.html':'/staff-disbursing-officer.html';loadProfile();}catch(error){localStorage.removeItem('sasyaSession');window.location.replace('/staff-login.html');}}
guardProfile();
async function loadProfile(){try{const response=await fetch('/api/procurements/'+encodeURIComponent(farmerId),{headers});const result=await response.json();if(!response.ok)throw new Error(result.error||'Unable to load farmer profile.');const p=result.procurement;const f=result.farmer;document.getElementById('content').innerHTML='<div class="header"><div><h1>'+f.name+'</h1><div class="sub">Farmer ID '+f.id+' · '+p.center+'</div></div><span class="badge">'+p.stage+'</span></div><section class="panel"><h2>Farmer details</h2><div class="grid"><div><div class="label">Mobile</div><div class="value">'+(f.mobile||'Not provided')+'</div></div><div><div class="label">Address</div><div class="value">'+(f.address||'Not provided')+'</div></div><div><div class="label">Aadhaar</div><div class="value">'+(f.aadhaar||'Not provided')+'</div></div><div><div class="label">Crop certificate number</div><div class="value">'+(f.cropCertificateNumber||'Not provided')+'</div></div></div></section><section class="panel"><h2>Procurement details</h2><div class="grid"><div><div class="label">Crop</div><div class="value">'+p.crop+'</div></div><div><div class="label">Expected quantity</div><div class="value">'+p.expectedQuantity+' qtl</div></div><div><div class="label">Quality result</div><div class="value">'+(p.quality?.decision||'Pending')+'</div></div><div><div class="label">Actual weight</div><div class="value">'+(p.quantity?.weight?p.quantity.weight+' qtl':'Pending')+'</div></div><div><div class="label">Payment status</div><div class="value">'+(result.payment?.status||'Not ready')+'</div></div><div><div class="label">Amount payable</div><div class="value">'+(result.payment?.amount?'₹'+result.payment.amount:'Not calculated')+'</div></div></div></section></div>';}catch(error){document.getElementById('content').innerHTML='<div class="error">'+error.message+'</div>';}}
</script><script src="i18n.js"></script></body></html>
